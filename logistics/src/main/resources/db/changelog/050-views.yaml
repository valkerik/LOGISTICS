databaseChangeLog:
  # 1) Обзор по перевозкам с присоединёнными названиями клиента/перевозчика/ТС/водителя
  - changeSet:
      id: 050-v-shipment-overview
      author: pogodin
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE VIEW v_shipment_overview AS
              SELECT
                  s.id                                 AS shipment_id,
                  s.status                             AS status,
                  s.price                              AS price,
                  s.cargo_description                  AS cargo_description,
                  s.cargo_weight                       AS cargo_weight,
                  s.planned_pickup_at                  AS planned_pickup_at,
                  s.planned_delivery_at                AS planned_delivery_at,
                  (s.planned_delivery_at - s.planned_pickup_at) AS planned_duration,
                  c.name                               AS client_name,
                  cr.name                              AS carrier_name,
                  v.plate_no                           AS vehicle_plate_no,
                  v.type                               AS vehicle_type,
                  d.full_name                          AS driver_name
              FROM shipment s
              JOIN client   c  ON c.id  = s.client_id
              JOIN carrier  cr ON cr.id = s.carrier_id
              LEFT JOIN vehicle v ON v.id = s.vehicle_id
              LEFT JOIN driver  d ON d.id = s.driver_id;
      rollback:
        - sql: |
            DROP VIEW IF EXISTS v_shipment_overview;

  # 2) Последний статус каждой перевозки (через DISTINCT ON)
  - changeSet:
      id: 051-v-shipment-last-status
      author: pogodin
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE VIEW v_shipment_last_status AS
              SELECT DISTINCT ON (h.shipment_id)
                  h.shipment_id,
                  h.status             AS last_status,
                  h.changed_at,
                  h.changed_by,
                  u.username           AS changed_by_username
              FROM shipment_status_history h
              LEFT JOIN app_user u ON u.id = h.changed_by
              ORDER BY h.shipment_id, h.changed_at DESC;
      rollback:
        - sql: |
            DROP VIEW IF EXISTS v_shipment_last_status;

  # 3) Сводка по перевозчикам: кол-во ТС/водителей (всего и активных)
  - changeSet:
      id: 052-v-carrier-summary
      author: pogodin
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE VIEW v_carrier_summary AS
              SELECT
                  cr.id                                    AS carrier_id,
                  cr.name                                  AS carrier_name,
                  COUNT(DISTINCT v.id)                     AS vehicles_total,
                  COUNT(DISTINCT d.id)                     AS drivers_total,
                  COUNT(DISTINCT v.id) FILTER (WHERE v.active) AS vehicles_active,
                  COUNT(DISTINCT d.id) FILTER (WHERE d.active) AS drivers_active
              FROM carrier cr
              LEFT JOIN vehicle v ON v.carrier_id = cr.id
              LEFT JOIN driver  d ON d.carrier_id = cr.id
              GROUP BY cr.id, cr.name;
      rollback:
        - sql: |
            DROP VIEW IF EXISTS v_carrier_summary;

  # 4) Сводка по клиентам: кол-во перевозок и выручка, + разрез по статусам
  - changeSet:
      id: 053-v-client-stats
      author: pogodin
      changes:
        - sql:
            splitStatements: false
            stripComments: true
            sql: |
              CREATE OR REPLACE VIEW v_client_stats AS
              SELECT
                  c.id                         AS client_id,
                  c.name                       AS client_name,
                  COUNT(s.id)                  AS shipments_total,
                  COALESCE(SUM(s.price), 0)::numeric(14,2) AS revenue_total,
                  COUNT(*) FILTER (WHERE s.status = 'NEW')        AS shipments_new,
                  COUNT(*) FILTER (WHERE s.status = 'ASSIGNED')   AS shipments_assigned,
                  COUNT(*) FILTER (WHERE s.status = 'IN_TRANSIT') AS shipments_in_transit,
                  COUNT(*) FILTER (WHERE s.status = 'DELIVERED')  AS shipments_delivered,
                  COUNT(*) FILTER (WHERE s.status = 'CANCELLED')  AS shipments_cancelled
              FROM client c
              LEFT JOIN shipment s ON s.client_id = c.id
              GROUP BY c.id, c.name;
      rollback:
        - sql: |
            DROP VIEW IF EXISTS v_client_stats;
